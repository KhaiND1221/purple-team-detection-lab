title: Mshta Executing Remote Content or Inline Script
id: b3e85a17-2f6c-49d0-a7b4-6c1e0d9f3a03
status: experimental
description: Detects mshta.exe launched with a URL or inline script, used as a signed-binary proxy for code execution.
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: KhaiND1221
date: 2026-09-25
tags:
  - attack.defense_evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\mshta.exe'
  selection_cli:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'javascript:'
      - 'vbscript:'
  condition: selection_img and selection_cli
falsepositives:
  - Legacy internal HTA applications loaded from an intranet URL
level: high
