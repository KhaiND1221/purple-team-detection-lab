title: Office Application Spawns Command Interpreter
id: 6f1a2c4e-3b7d-4e58-9a10-2d5c8b7e1f01
status: experimental
description: Detects Office applications launching shells or script hosts, a common result of a malicious macro after phishing.
references:
  - https://attack.mitre.org/techniques/T1204/002/
author: KhaiND1221
date: 2026-09-25
tags:
  - attack.execution
  - attack.t1204.002
  - attack.initial_access
  - attack.t1566.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate Office add-ins or macros that call cmd.exe or PowerShell
level: high
