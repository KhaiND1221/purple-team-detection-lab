title: PowerShell Encoded Command Execution
id: 0c9d7e21-5a44-4b3f-8e62-91f3a7c5d202
status: experimental
description: Detects PowerShell started with an encoded command argument, often used to hide payloads.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: KhaiND1221
date: 2026-09-25
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
  condition: selection_img and selection_cli
falsepositives:
  - Administration scripts and deployment tools that pass encoded commands
level: medium
