title: LSASS Memory Dump via comsvcs.dll MiniDump
id: a82c5e64-1d97-4f03-9b58-3e7a6d1c0f05
status: experimental
description: Detects rundll32 calling comsvcs.dll MiniDump (by name or by ordinal 24) to dump LSASS memory.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: KhaiND1221
date: 2026-09-25
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  selection_ordinal:
    CommandLine|contains|all:
      - 'comsvcs'
      - '#24'
      - 'full'
  condition: selection_name or selection_ordinal
falsepositives:
  - Authorized red team or forensic acquisition activity
level: high
